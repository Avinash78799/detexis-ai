name: Shield tests
on:
  push:
    paths: ['detexis-shield/**', '.github/workflows/shield.yml', 'shield_verification.py', 'app.py']
  pull_request:
    paths: ['detexis-shield/**', '.github/workflows/shield.yml', 'shield_verification.py', 'app.py']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shield
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: shield
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U shield" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql+psycopg2://shield:ci-only@localhost:5432/shield
      INTEGRATION_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: detexis-shield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -e sensor-sdk
      - run: python -m pytest -q -p no:cacheprovider
      - run: docker compose config --quiet
