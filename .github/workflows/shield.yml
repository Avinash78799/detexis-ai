name: Shield tests
on:
  push:
    paths: ['detexis-shield/**', '.github/workflows/shield.yml']
  pull_request:
    paths: ['detexis-shield/**', '.github/workflows/shield.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detexis-shield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -e sensor-sdk
      - run: python -m pytest -q -p no:cacheprovider
