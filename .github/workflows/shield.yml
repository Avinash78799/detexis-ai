name: Shield tests
on:
  push:
    paths: ['detexis-shield/**', '.github/workflows/shield.yml', 'shield_verification.py', 'app.py', 'requirements.txt', 'templates/shield_entry.html', 'static/shield-entry.css', 'vercel.json']
  pull_request:
    paths: ['detexis-shield/**', '.github/workflows/shield.yml', 'shield_verification.py', 'app.py', 'requirements.txt', 'templates/shield_entry.html', 'static/shield-entry.css', 'vercel.json']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shield
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: shield
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U shield" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql+psycopg2://shield:ci-only@localhost:5432/shield
      INTEGRATION_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: detexis-shield
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -r requirements-dev.txt -r ../requirements.txt -e sensor-sdk
      - name: Verify packaged detection release and version history
        env:
          RULE_PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$RULE_PREVIOUS_SHA" ] && [ "$RULE_PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ]; then
            python tools/validate_rule_release.py --previous-ref "$RULE_PREVIOUS_SHA"
          else
            python tools/validate_rule_release.py
          fi
      - name: Audit installed application and test dependencies
        run: |
          python -m venv /tmp/shield-audit
          /tmp/shield-audit/bin/python -m pip install pip-audit==2.10.1
          /tmp/shield-audit/bin/python -m pip_audit --path "$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
      - run: python -m pytest -q -p no:cacheprovider
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.validation.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.computer.yml -f docker-compose.malware.yml --profile malware config --quiet
  windows-helpers:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: detexis-shield
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Verify native stderr and exit handling in Windows PowerShell
        run: ./tests/test_native_command.ps1
      - name: Verify local update stops after backup failure
        run: ./tests/test_local_update.ps1
      - name: Parse local HTTPS startup helper
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/start_local_https.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
  local-https:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detexis-shield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - name: Validate isolated local TLS configuration
        run: |
          docker compose -p shield-local-https-ci -f docker-compose.yml -f docker-compose.validation.yml -f docker-compose.local-tls.yml --profile localtls config --quiet
          docker run --rm -v "$PWD/Caddyfile.local:/etc/caddy/Caddyfile:ro" caddy:2.11.9 caddy validate --config /etc/caddy/Caddyfile
      - name: Start disposable API and local TLS proxy
        run: docker compose -p shield-local-https-ci -f docker-compose.yml -f docker-compose.validation.yml -f docker-compose.local-tls.yml --profile localtls up --build -d --wait api localproxy
      - name: Verify TLS and authenticated account flow without installing trust
        run: |
          docker cp shield-local-https-ci-localproxy-1:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/shield-local-root.crt"
          python tools/smoke_local_https.py --ca "$RUNNER_TEMP/shield-local-root.crt" --confirm-disposable-ci-stack
      - name: Show failure logs
        if: failure()
        run: docker compose -p shield-local-https-ci -f docker-compose.yml -f docker-compose.validation.yml -f docker-compose.local-tls.yml --profile localtls logs --tail 60 api localproxy
      - name: Stop disposable CI services
        if: always()
        run: docker compose -p shield-local-https-ci -f docker-compose.yml -f docker-compose.validation.yml -f docker-compose.local-tls.yml --profile localtls stop
  ml-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detexis-shield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ml/requirements.txt -e sensor-sdk
      - run: python tools/smoke_ml.py
      - uses: actions/upload-artifact@v4
        with:
          name: ml-software-smoke
          path: detexis-shield/ml-smoke-results.json
