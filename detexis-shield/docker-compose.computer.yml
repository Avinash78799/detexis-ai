# Computer-hosted instance; separate from synthetic benchmark data.
services:
  db:
    restart: unless-stopped
  redis:
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
  api:
    restart: unless-stopped
  worker:
    restart: unless-stopped
  maintenance:
    restart: unless-stopped
    environment:
      RETENTION_DAYS: '7'
  scanner:
    restart: unless-stopped
