Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 2
MaxQueue 4
StreamMaxLength 1M
# Transport is capped at 1 MiB by the API; allow archive members up to the
# aggregate scan budget so they are not silently skipped at the transport cap.
MaxFileSize 8M
MaxScanSize 8M
MaxRecursion 5
MaxFiles 50
MaxScanTime 4000
ReadTimeout 10
CommandReadTimeout 5
ConcurrentDatabaseReload no
AlertExceedsMax yes
AlertEncrypted yes
SelfCheck 30
LogTime yes
