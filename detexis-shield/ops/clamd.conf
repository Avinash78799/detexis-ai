Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 2
MaxQueue 4
StreamMaxLength 1M
MaxFileSize 1M
MaxScanSize 8M
MaxRecursion 5
MaxFiles 50
MaxScanTime 4000
ReadTimeout 10
CommandReadTimeout 5
ConcurrentDatabaseReload no
AlertExceedsMax yes
AlertEncrypted yes
SelfCheck 30
LogTime yes
